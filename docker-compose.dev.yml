services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=development
    volumes:
      - ./apps/backend/src:/app/src:delegated
      - ./apps/backend/scripts:/app/scripts:delegated
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
