services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      # Mount source code for hot reload
      - ./apps/frontend/src:/app/src:delegated
      - ./apps/frontend/public:/app/public:delegated
      - ./apps/frontend/index.html:/app/index.html:delegated
      - ./apps/frontend/vite.config.js:/app/vite.config.js:delegated
      - ./apps/frontend/tailwind.config.js:/app/tailwind.config.js:delegated
      - ./apps/frontend/postcss.config.js:/app/postcss.config.js:delegated
      # Don't mount node_modules - use container's version
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app-network
    stdin_open: true
    tty: true

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - CORS_ORIGIN=http://localhost:3000
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - ./apps/backend/src:/app/src:delegated
      - ./apps/backend/scripts:/app/scripts:delegated
      # Don't mount node_modules - use container's version
      - backend_node_modules:/app/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  frontend_node_modules:
  backend_node_modules:
